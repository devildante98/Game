# Publica el servidor (Cloud Functions) y las reglas de Firestore en Firebase cada vez que cambian en main.
# Necesita el secreto FIREBASE_SA (la clave JSON de una cuenta de servicio de Firebase) en
# Settings → Secrets and variables → Actions. Si todavía no está, el trabajo se salta sin fallar.
name: Publicar servidor en Firebase
on:
  push:
    branches: [main]
    paths:
      - "_server/**"
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase.yml"
  workflow_dispatch:
concurrency:
  group: firebase-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_SA: ${{ secrets.FIREBASE_SA != '' }}
    steps:
      - name: Aviso si falta la clave
        if: env.HAS_SA != 'true'
        run: echo "::warning::Falta el secreto FIREBASE_SA; no se publica nada."
      - uses: actions/checkout@v4
        if: env.HAS_SA == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SA == 'true'
        with:
          node-version: 22
      - name: Instalar dependencias del servidor
        if: env.HAS_SA == 'true'
        run: npm ci --prefix _server --no-audit --no-fund
      - name: Preparar la clave
        if: env.HAS_SA == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SA }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Avisos de Discord (webhooks desde los secretos; si falta alguno, ese aviso no se envía)
        if: env.HAS_SA == 'true'
        env:
          WC: ${{ secrets.DISCORD_WEBHOOK_CODIGOS }}
          WS: ${{ secrets.DISCORD_WEBHOOK_SORTEOS }}
          WT: ${{ secrets.DISCORD_WEBHOOK_TORNEOS }}
          RA: ${{ secrets.DISCORD_ROL_AVISOS }}
          WE: ${{ secrets.DISCORD_WEBHOOK_EVENTOS }}
        run: printf 'DISCORD_WEBHOOK_CODIGOS=%s\nDISCORD_WEBHOOK_SORTEOS=%s\nDISCORD_WEBHOOK_TORNEOS=%s\nDISCORD_ROL_AVISOS=%s\nDISCORD_WEBHOOK_EVENTOS=%s\n' "$WC" "$WS" "$WT" "$RA" "$WE" > _server/.env
      - name: Publicar en Firebase (funciones y reglas)
        if: env.HAS_SA == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@15.36.0 deploy --only functions,firestore:rules --project pokegacha-fdef9 --non-interactive --force
      - name: Borrar la clave
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" _server/.env
