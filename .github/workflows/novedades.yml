# Anuncia en Discord las novedades de cada versión nueva del juego (src/tools/discord/novedades.js) al publicar en main.
# Usa el secreto FIREBASE_SA (para apuntar qué versión se ha anunciado ya y no repetirla) y el webhook del canal:
# DISCORD_WEBHOOK_NOVEDADES (el canal #novedades; también vale con el nombre DISCORD_WEBHOOK_AVISOS) y el rol que se menciona: DISCORD_ROL_NOVEDADES («Avisos de novedades»;
# si no existe, DISCORD_ROL_AVISOS). Sin el webhook no se envía nada.
name: Anunciar novedades en Discord
on:
  push:
    branches: [main]
    paths:
      - "src/assemble.py"
      - "src/tools/discord/**"
      - ".github/workflows/novedades.yml"
  workflow_dispatch:
concurrency:
  group: discord-novedades
  cancel-in-progress: false
jobs:
  anunciar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_SA: ${{ secrets.FIREBASE_SA != '' }}
    steps:
      - name: Aviso si falta la clave
        if: env.HAS_SA != 'true'
        run: echo "::warning::Falta el secreto FIREBASE_SA; no se anuncia nada."
      - uses: actions/checkout@v4
        if: env.HAS_SA == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SA == 'true'
        with:
          node-version: 22
      - name: Instalar dependencias del servidor
        if: env.HAS_SA == 'true'
        run: npm ci --prefix _server --no-audit --no-fund
      - name: Preparar la clave y los webhooks
        if: env.HAS_SA == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SA }}
          WN: ${{ secrets.DISCORD_WEBHOOK_NOVEDADES }}
          WA: ${{ secrets.DISCORD_WEBHOOK_AVISOS }}
          RN: ${{ secrets.DISCORD_ROL_NOVEDADES }}
          RA: ${{ secrets.DISCORD_ROL_AVISOS }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          printf 'DISCORD_WEBHOOK_NOVEDADES=%s\nDISCORD_WEBHOOK_AVISOS=%s\nDISCORD_ROL_NOVEDADES=%s\nDISCORD_ROL_AVISOS=%s\n' "$WN" "$WA" "$RN" "$RA"
          # qué secretos hay (sin enseñar su valor), para saber por qué no se envía si falta alguno
          echo "Webhook de #novedades: $([ -n "$WN" ] && echo sí || echo no) · de Avisos: $([ -n "$WA" ] && echo sí || echo no) · rol: $([ -n "$RN$RA" ] && echo sí || echo no)" > _server/.env
      # se espera un poco a que la web (GitHub Pages) ya tenga la versión nueva
      - name: Esperar a que la web se publique
        if: env.HAS_SA == 'true'
        run: sleep 90
      - name: Anunciar
        if: env.HAS_SA == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node src/tools/discord/novedades.js
      - name: Borrar la clave
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" _server/.env
