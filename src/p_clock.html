<script>
// ===== freno contra aceleradores de páginas web (speedhack) =====
// Todo lo que se produce solo se calcula con el reloj del navegador (Date.now). Un acelerador lo adelanta.
// Cada 30 s se compara con la hora real del servidor (cabecera Date): si el reloj del navegador corre
// más deprisa, a partir de ahí el juego solo ve el tiempo real (el reloj nunca va hacia atrás: se queda
// quieto hasta que la hora real lo alcanza, así que lo ganado antes de detectarlo también se compensa).
(function(){
  var W=window,o=Date.now.bind(Date),K={on:false,r:1,peak:1,at:0,last:0,blk:0,n:0},S=[],ds=0,dl=0,off=0,rv=0;
  W.PGC_SPD=K;
  function srv(){return ds+(o()-dl)/K.r}                    // hora real estimada
  Date.now=function(){var l=o();if(!K.on){if(l>rv)rv=l;return l}var v=Math.floor(srv()+off);if(v<rv)v=rv;rv=v;K.blk=Math.max(0,l-v);return v};
  function sample(){
    var a=o(),u=location.origin+"/robots.txt?_v=clk"+a.toString(36)+Math.random().toString(36).slice(2,6);
    fetch(u,{method:"HEAD",cache:"no-store"}).then(function(res){
      var b=o(),d=Date.parse(res.headers.get("date")||"");if(!(d>0)||b-a>20000)return;   // respuesta muy lenta: no vale
      d+=500+(parseInt(res.headers.get("age")||"0",10)||0)*1000;var m=(a+b)/2;
      if(S.length&&d-S[S.length-1][0]<25000)return;   // con el acelerador los intervalos también corren: se guarda una muestra cada ~30 s reales
      S.push([d,m]);if(S.length>20)S.shift();
      // ventana: la muestra más antigua de los últimos ~3 min con al menos 60 s de diferencia
      var p=null;for(var i=0;i<S.length-1;i++){var dd=d-S[i][0];if(dd>=60000&&dd<=200000){p=S[i];break}}
      if(!p){if(!K.on){ds=d;dl=m}return}
      var r=(m-p[1])/(d-p[0]);
      if(!K.on&&r>1.25){off=p[1]-p[0];ds=p[0];dl=p[1];K.r=Math.max(1,r);K.on=true;K.at=Date.now()}
      if(K.on){ds=d;dl=m;K.r=r>1.1?r:1;if(r>K.peak)K.peak=r;K.last=r;if(r>1.25)K.n++}
    }).catch(function(){});
  }
  if(/^https?:$/.test(location.protocol)){setTimeout(sample,1500);setInterval(sample,30000)}
})();
</script>
